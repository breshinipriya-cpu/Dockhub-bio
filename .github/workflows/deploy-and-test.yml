name: Phase 7 - GitHub Pages Deployment & Live E2E Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Stage 1-5: Build & Deploy to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage 3 - Build Application Artifacts
        run: |
          mkdir -p _site
          cp index.html _site/
          cp script.js _site/
          cp style.css _site/
          echo "Static web application build ready for GitHub Pages deployment."

      - name: Stage 4 - Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Stage 5 - Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Stage 6-13: Verification, Live Selenium Testing & Reporting
  e2e-testing:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Selenium & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium openpyxl requests

      - name: Setup Chrome & Webdriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Stage 6 & 7 - Wait for & Verify Live Deployment
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          TARGET_URL="${BASE_URL:-https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/}"
          echo "TARGET_URL=$TARGET_URL" >> $GITHUB_ENV
          python automation/utils/verify_deployment.py "$TARGET_URL"

      - name: Stage 8 - 10 - Run 430 Selenium E2E Tests & Generate Reports
        env:
          BASE_URL: ${{ env.TARGET_URL }}
          HEADLESS: "true"
        run: |
          python automation/run_framework.py

      - name: Stage 11 - Upload Artifacts (Retention: 30 Days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Automation-Test-Reports
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 30

      - name: Stage 12 & 13 - Publish Summary & Store Historical Evidence
        if: always()
        run: |
          if [ -f automation/reports/Summary/summary.md ]; then
            cat automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY
          fi
