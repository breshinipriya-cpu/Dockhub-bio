name: Selenium QA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "selenium-qa"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Web Application
        run: |
          mkdir -p _site
          cp index.html _site/
          cp script.js _site/
          cp style.css _site/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  selenium-e2e:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Chrome
        run: |
          python -m pip install --upgrade pip
          pip install selenium openpyxl requests
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Start Local Web Server & Execute 430 Selenium E2E Test Cases
        env:
          BASE_URL: "http://127.0.0.1:8765/"
          HEADLESS: "true"
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          python automation/utils/verify_deployment.py "http://127.0.0.1:8765/" || echo "Proceeding to test suite..."
          python automation/run_framework.py

      - name: Upload Test Artifacts & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-QA-Test-Reports
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 30

      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f automation/reports/Summary/summary.md ]; then
            cat automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY
          fi
