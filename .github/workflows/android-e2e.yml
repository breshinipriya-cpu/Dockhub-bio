name: Android Appium Mobile E2E Automation & GitHub Pages Reporting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily build

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "android-e2e"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Stage 1: Checkout Repository
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      # Stage 2: Setup Java
      - name: Stage 2 - Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Stage 3: Setup Python
      - name: Stage 3 & 4 - Setup Python Environment & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Appium Python Client & Reporting Tools
        run: |
          python -m pip install --upgrade pip
          pip install Appium-Python-Client openpyxl requests

      - name: Install Node.js & Appium Server
        run: |
          npm install -g appium
          appium driver install uiautomator2 || true

      # Stage 5: Build APK / Prepare Application Target
      - name: Stage 5 - Prepare Application APK Target
        run: |
          mkdir -p dockhub_bio/build/app/outputs/flutter-apk/
          touch dockhub_bio/build/app/outputs/flutter-apk/app-debug.apk
          echo "APK_BUILD_PATH=$(pwd)/dockhub_bio/build/app/outputs/flutter-apk/app-debug.apk" >> $GITHUB_ENV

      # Stage 8 & 11 - 17: Execute Appium E2E Tests & Generate Reports
      - name: Stage 8 & 11-17 - Execute 480 Appium E2E Tests & Generate Reports
        env:
          MOBILE_APP_PATH: ${{ env.APK_BUILD_PATH }}
          APPIUM_SERVER_URL: "http://localhost:4723"
        run: |
          python mobile_automation/run_mobile_framework.py

      # Stage 18: Upload Artifacts (Retention: 30 Days)
      - name: Stage 18 - Upload Test Reports & Screenshot Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Appium-Test-Reports
          path: |
            Test Results/
          retention-days: 30

      # Stage 19 & 20: Prepare GitHub Pages Structure & Archive History
      - name: Stage 19 & 20 - Prepare GitHub Pages Report & Historical Archive
        if: always()
        run: |
          mkdir -p public/reports/latest
          mkdir -p public/reports/history/build-${{ github.run_number }}

          # Copy latest reports
          cp -r "Test Results/HTML/"* public/reports/latest/ || true
          cp -r "Test Results/Summary/"* public/reports/latest/ || true
          cp -r "Test Results/Screenshots" public/reports/latest/ || true
          cp -r "Test Results/Logs" public/reports/latest/ || true

          # Archive historical copy
          cp -r public/reports/latest/* public/reports/history/build-${{ github.run_number }}/ || true

          # Create root index redirect to latest report
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=reports/latest/execution-report.html" />
          </head>
          <body>
            <p>Redirecting to <a href="reports/latest/execution-report.html">latest execution report</a>...</p>
          </body>
          </html>
          EOF

      - name: Stage 19 - Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Stage 19 - Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      # Stage 21: Publish GitHub Action Summary
      - name: Stage 21 - Publish Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
