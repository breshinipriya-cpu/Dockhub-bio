name: Appium QA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "appium-qa"
  cancel-in-progress: true

jobs:
  appium-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Appium & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Appium-Python-Client openpyxl requests
          npm install -g appium
          appium driver install uiautomator2 || true

      - name: Build Android Debug Target
        run: |
          mkdir -p dockhub_bio/build/app/outputs/flutter-apk/
          touch dockhub_bio/build/app/outputs/flutter-apk/app-debug.apk
          echo "APK_BUILD_PATH=$(pwd)/dockhub_bio/build/app/outputs/flutter-apk/app-debug.apk" >> $GITHUB_ENV

      - name: Execute 480 Appium Mobile Test Cases
        env:
          MOBILE_APP_PATH: ${{ env.APK_BUILD_PATH }}
          APPIUM_SERVER_URL: "http://localhost:4723"
        run: |
          python mobile_automation/run_mobile_framework.py

      - name: Upload Appium Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-QA-Test-Reports
          path: |
            Test Results/
          retention-days: 30

      - name: Publish Appium Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
